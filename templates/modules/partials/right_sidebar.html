{% load static %}
<!-- ═══ RIGHT SIDEBAR — TOC + Actions ═══ -->
<aside id="lesson-toc"
  class="fixed right-0 top-16 bottom-0 w-[260px] z-30 flex flex-col
         border-l border-white/[0.06] overflow-hidden
         transform transition-all duration-300
         translate-x-full xl:translate-x-0"
  style="background: linear-gradient(180deg, #0a0d12 0%, #080b0f 100%);">

  <!-- Reading Progress Bar (top edge) -->
  <div class="absolute top-0 left-0 right-0 h-0.5 bg-white/5">
    <div id="reading-progress-bar"
         class="h-full transition-all duration-100 ease-out"
         style="width: 0%; background: linear-gradient(90deg, #00f5ff, #00ff88);">
    </div>
  </div>

  <!-- TOC Header -->
  <div class="flex-shrink-0 px-5 pt-5 pb-3 border-b border-white/[0.06]">
    <div class="flex items-center gap-2 mb-1">
      <div class="w-1 h-4 rounded-full bg-cyber-cyan/60"></div>
      <span class="text-[11px] font-bold text-cyber-text uppercase tracking-widest">On This Page</span>
    </div>
  </div>

  <!-- TOC Content -->
  <div id="toc-container" class="flex-1 overflow-y-auto px-4 py-3"
       style="scrollbar-width: thin; scrollbar-color: #1e293b transparent;">

    {% if toc and toc != '<div class="toc">\n</div>\n' %}
    <!-- Rendered TOC from Python-Markdown -->
    <div class="toc-nav text-[12px]">{{ toc }}</div>
    {% else %}
    <!-- Fallback: JS-generated TOC -->
    <div id="js-toc" class="space-y-0.5 text-[12px] text-cyber-muted">
      <p class="text-[11px] text-cyber-muted/50 italic">No headings found.</p>
    </div>
    {% endif %}
  </div>

  <!-- Quick Actions -->
  <div class="flex-shrink-0 px-4 py-4 border-t border-white/[0.06] space-y-2">

    <!-- Mark complete -->
    <button id="toc-complete-btn" onclick="markComplete()"
            class="w-full flex items-center gap-2.5 px-3 py-2.5 rounded-lg text-xs font-semibold
                   bg-cyber-cyan/[0.08] text-cyber-cyan border border-cyber-cyan/20
                   hover:bg-cyber-cyan/[0.15] hover:border-cyber-cyan/40 hover:shadow-[0_0_15px_rgba(0,245,255,0.1)]
                   transition-all duration-200">
      <svg class="w-3.5 h-3.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
      Mark as Complete
    </button>

    <!-- Prev / Next navigation -->
    <div class="grid grid-cols-2 gap-1.5">
      {% if prev_module %}
      <a href="{% url 'modules:detail' prev_module.slug %}"
         class="flex items-center gap-1.5 px-2.5 py-2 rounded-lg text-[11px] text-cyber-muted
                border border-white/[0.06] hover:border-white/15 hover:text-cyber-text
                transition-all duration-150">
        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
        Prev
      </a>
      {% else %}
      <span class="px-2.5 py-2 rounded-lg text-[11px] text-cyber-muted/30 border border-white/[0.04] text-center">Prev</span>
      {% endif %}

      {% if next_module %}
      <a href="{% url 'modules:detail' next_module.slug %}"
         class="flex items-center justify-end gap-1.5 px-2.5 py-2 rounded-lg text-[11px] text-cyber-cyan
                border border-cyber-cyan/20 hover:border-cyber-cyan/40 hover:bg-cyber-cyan/[0.05]
                transition-all duration-150">
        Next
        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
      </a>
      {% else %}
      <span class="px-2.5 py-2 rounded-lg text-[11px] text-cyber-muted/30 border border-white/[0.04] text-center">Next</span>
      {% endif %}
    </div>

    <!-- Resources placeholder -->
    <div class="mt-1 px-3 py-3 rounded-lg border border-dashed border-white/[0.07] text-center">
      <p class="text-[10px] text-cyber-muted/50 font-mono">[ RELATED LABS ]</p>
      <p class="text-[10px] text-cyber-muted/30 mt-0.5">Coming soon</p>
    </div>
  </div>
</aside>
